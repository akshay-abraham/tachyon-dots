# ~/.config/foot/foot.ini
#
# foot 1.28.0
# JetBrainsMono Nerd Font • GitHub-style dark palette • green accent

[main]
shell=/usr/bin/zsh
font=JetBrainsMono Nerd Font:size=11.5
initial-window-size-chars=125x25
dpi-aware=no
pad=6x6

# Render box-drawing and powerline glyphs using the configured font.
box-drawings-uses-font-glyphs=yes


[scrollback]
lines=10000


[cursor]
style=beam
unfocused-style=hollow
blink=no


[mouse]
hide-when-typing=yes


[colors-dark]
# GitHub-style dark base.
background=0d1117
foreground=c9d1d9

# Green accent.
selection-background=5acb76
selection-foreground=0d1117
cursor=0d1117 5acb76

# Standard ANSI palette.
regular0=484f58
regular1=ff7b72
regular2=3fb950
regular3=d29922
regular4=58a6ff
regular5=bc8cff
regular6=39c5cf
regular7=b1bac4

# Bright ANSI palette.
bright0=6e7681
bright1=ffa198
bright2=56d364
bright3=e3b341
bright4=79c0ff
bright5=d2a8ff
bright6=56d4dd
bright7=ffffff

# Subtle transparency for compositor effects.
alpha=0.83
blur=yes

# URL jump-label appearance.
jump-labels=0d1117 5acb76

# URL underline color.
urls=5acb76


[url]
# Open detected URLs with the desktop's default handler.
launch=xdg-open ${url}

# Characters used to generate URL jump labels.
label-letters=asdfjkl;ghqweruiotyxcvbnm


[key-bindings]
# Copy the last command's output directly to the Wayland clipboard.
pipe-command-output=[wl-copy] Control+Shift+g
